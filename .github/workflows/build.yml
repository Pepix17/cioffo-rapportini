
name: Build Cioffo Rapportini

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate package configuration
        run: node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json valido')"

      - name: Check JavaScript syntax
        run: |
          node --input-type=commonjs -e '
          const fs = require("fs");
          const html = fs.readFileSync("www/index.html", "utf8");
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          for (const script of scripts) {
            if (script[1].trim()) {
              require("vm").Script(script[1]);
            }
          }
          console.log("Controllo script completato");
          '
